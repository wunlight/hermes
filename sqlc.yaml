version: "2"

sql:
  - engine: "postgresql"
    queries: "./sql"
    schema: "./migrations"

    gen:
      go:
        package: "sqlc"
        out: "./internal/adapters/sqlc"
        sql_package: "pgx/v5"

        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
